name: Cross-platform CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4
        with:
          activate-environment: molshredder
          environment-file: environment.yml
          channel-priority: strict

      - name: Resolve conda environment
        run: |
          prefix="$(conda run --no-capture-output -n molshredder python -c 'import sys; print(sys.prefix)')"
          test -n "$prefix"
          printf 'MOLSHREDDER_CONDA_PREFIX=%s\n' "$prefix" >> "$GITHUB_ENV"
          printf 'Conda prefix: %s\n' "$prefix"

      - name: Install Linux display and graphics development runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl-dev libglx-dev libegl-dev libxkbcommon-x11-0 \
            libxcb-cursor0 mesa-vulkan-drivers xvfb xauth

      - name: Configure
        run: >-
          conda run --no-capture-output -n molshredder
          cmake -S . -B build/ci
          -DBUILD_TESTING=ON
          -DMOLSHREDDER_WARNINGS_AS_ERRORS=ON
          -DMOLSHREDDER_BUILD_DESKTOP=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_PREFIX_PATH="$MOLSHREDDER_CONDA_PREFIX"
          -DPython3_ROOT_DIR="$MOLSHREDDER_CONDA_PREFIX"

      - name: Build
        run: >-
          conda run --no-capture-output -n molshredder
          cmake --build build/ci --config Debug --parallel

      - name: Test required molfile ABI loader gate
        run: >-
          conda run --no-capture-output -n molshredder
          ctest --test-dir build/ci -C Debug
          --output-on-failure --no-tests=error
          -R "^io\.molfile_provider$"

      - name: Test (macOS and Windows)
        if: runner.os != 'Linux'
        run: >-
          conda run --no-capture-output -n molshredder
          ctest --test-dir build/ci -C Debug
          --output-on-failure --no-tests=error

      - name: Test (Linux/Xvfb)
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a
          conda run --no-capture-output -n molshredder
          ctest --test-dir build/ci -C Debug
          --output-on-failure --no-tests=error

      - name: Install staging
        run: >-
          conda run --no-capture-output -n molshredder
          cmake --install build/ci --config Debug --prefix build/stage

      - name: Smoke installed executable (Unix)
        if: runner.os != 'Windows'
        run: |
          conda run --no-capture-output -n molshredder ./build/stage/bin/molshredder --version
          conda run --no-capture-output -n molshredder ./build/stage/bin/molshredder system version --format json
          conda run --no-capture-output -n molshredder ./build/stage/bin/molshredder system info --format json
          test -f build/stage/share/molshredder/molshredder-support.json
          test -f build/stage/share/molshredder/schemas/capability-support-v1.schema.json
          script_path="$GITHUB_WORKSPACE/tests/automation/fixtures/success.py"
          structure_path="$GITHUB_WORKSPACE/tests/io/fixtures/synthetic_multimodel.pdb"
          script_arguments="$(conda run --no-capture-output -n molshredder python -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "$structure_path" ci-installed-cli)"
          conda run --no-capture-output -n molshredder \
            ./build/stage/bin/molshredder script run \
            --path "$script_path" --arguments-json "$script_arguments" \
            --trust true --format json

      - name: Smoke installed Python module (Unix)
        if: runner.os != 'Windows'
        run: |
          export PYTHONPATH=build/stage/lib/molshredder/python
          export MOLSHREDDER_SCRIPT="$GITHUB_WORKSPACE/tests/automation/fixtures/success.py"
          export MOLSHREDDER_STRUCTURE="$GITHUB_WORKSPACE/tests/io/fixtures/synthetic_multimodel.pdb"
          conda run --no-capture-output -n molshredder python -c \
            "import json, pathlib, molshredder; info=molshredder.invoke('system info'); manifest=json.loads(pathlib.Path('build/stage/share/molshredder/molshredder-support.json').read_text()); assert info['status'] == 'ok' and info['data']['features'] == manifest['features']"
          conda run --no-capture-output -n molshredder python -c \
            "import os, molshredder; result=molshredder.run_script(os.environ['MOLSHREDDER_SCRIPT'], [os.environ['MOLSHREDDER_STRUCTURE'], 'ci-installed-python'], trusted=True); assert result['status'] == 'ok' and result['data']['stdout'] == 'script-argument=ci-installed-python\\n'"

      - name: Smoke installed executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda run --no-capture-output -n molshredder .\build\stage\bin\molshredder.exe --version
          conda run --no-capture-output -n molshredder .\build\stage\bin\molshredder.exe system version --format json
          conda run --no-capture-output -n molshredder .\build\stage\bin\molshredder.exe system info --format json
          if (-not (Test-Path .\build\stage\share\molshredder\molshredder-support.json)) { throw "support manifest missing" }
          if (-not (Test-Path .\build\stage\share\molshredder\schemas\capability-support-v1.schema.json)) { throw "capability schema missing" }
          $scriptPath = (Resolve-Path .\tests\automation\fixtures\success.py).Path
          $structurePath = (Resolve-Path .\tests\io\fixtures\synthetic_multimodel.pdb).Path
          $scriptArguments = @($structurePath, "ci-installed-cli") | ConvertTo-Json -Compress
          conda run --no-capture-output -n molshredder .\build\stage\bin\molshredder.exe script run --path $scriptPath --arguments-json $scriptArguments --trust true --format json

      - name: Smoke installed Python module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "build/stage/lib/molshredder/python"
          $env:MOLSHREDDER_SCRIPT = (Resolve-Path .\tests\automation\fixtures\success.py).Path
          $env:MOLSHREDDER_STRUCTURE = (Resolve-Path .\tests\io\fixtures\synthetic_multimodel.pdb).Path
          conda run --no-capture-output -n molshredder python -c "import json, pathlib, molshredder; info=molshredder.invoke('system info'); manifest=json.loads(pathlib.Path('build/stage/share/molshredder/molshredder-support.json').read_text()); assert info['status'] == 'ok' and info['data']['features'] == manifest['features']"
          conda run --no-capture-output -n molshredder python -c "import os, molshredder; result=molshredder.run_script(os.environ['MOLSHREDDER_SCRIPT'], [os.environ['MOLSHREDDER_STRUCTURE'], 'ci-installed-python'], trusted=True); assert result['status'] == 'ok' and result['data']['stdout'] == 'script-argument=ci-installed-python\n'"

      - name: Check installed Desktop Metal and daily workflow (macOS)
        if: runner.os == 'macOS'
        run: |
          desktop=./build/stage/molshredder_desktop.app/Contents/MacOS/molshredder_desktop
          test -x "$desktop"
          graphics_output="$(conda run --no-capture-output -n molshredder "$desktop" --smoke --graphics-info-smoke 2>&1)"
          printf '%s\n' "$graphics_output"
          case "$graphics_output" in
            *'"api":"metal"'*) ;;
            *) echo "Expected Metal graphics API" >&2; exit 1 ;;
          esac
          conda run --no-capture-output -n molshredder "$desktop" \
            --daily-workflow-smoke \
            --open="$GITHUB_WORKSPACE/tests/io/fixtures/synthetic_multimodel.pdb" \
            --trajectory="$GITHUB_WORKSPACE/build/ci/desktop_trajectory.dcd" \
            --representation=spheres

      - name: Check installed Desktop Vulkan/OpenGL and daily workflow (Linux)
        if: runner.os == 'Linux'
        run: |
          desktop=./build/stage/bin/molshredder_desktop
          test -x "$desktop"
          graphics_output="$(xvfb-run -a conda run --no-capture-output -n molshredder "$desktop" --smoke --graphics-info-smoke 2>&1)"
          printf '%s\n' "$graphics_output"
          case "$graphics_output" in
            *'"api":"vulkan"'*|*'"api":"opengl"'*) ;;
            *) echo "Expected Vulkan or OpenGL graphics API" >&2; exit 1 ;;
          esac
          xvfb-run -a conda run --no-capture-output -n molshredder "$desktop" \
            --daily-workflow-smoke \
            --open="$GITHUB_WORKSPACE/tests/io/fixtures/synthetic_multimodel.pdb" \
            --trajectory="$GITHUB_WORKSPACE/build/ci/desktop_trajectory.dcd" \
            --representation=spheres

      - name: Check installed Desktop D3D and daily workflow (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $desktop = ".\build\stage\bin\molshredder_desktop.exe"
          if (-not (Test-Path $desktop)) { throw "installed Desktop executable missing" }
          $graphicsOutput = conda run --no-capture-output -n molshredder $desktop --smoke --graphics-info-smoke 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "installed Desktop graphics smoke failed" }
          Write-Host $graphicsOutput
          if ($graphicsOutput -notmatch '"api":"direct3d(11|12)"') { throw "Expected Direct3D graphics API" }
          conda run --no-capture-output -n molshredder $desktop `
            --daily-workflow-smoke `
            --open="$env:GITHUB_WORKSPACE\tests\io\fixtures\synthetic_multimodel.pdb" `
            --trajectory="$env:GITHUB_WORKSPACE\build\ci\desktop_trajectory.dcd" `
            --representation=spheres
          if ($LASTEXITCODE -ne 0) { throw "installed Desktop daily workflow failed" }
